# See doc/docker/README.md or https://github.com/instructure/canvas-lms/tree/master/doc/docker
# Host ports are offset from the local LMS stack (lms-local uses 3000, 5432, 6379).
#
# For VPS / production use docker-compose.production.yml instead
# (see doc/docker/PRODUCTION_VPS.md). Do not bind-mount source in production.
x-web: &WEB
  build:
    context: .
  links:
    - postgres
    - redis
  environment:
    POSTGRES_PASSWORD: sekret
    RAILS_ENV: development
    ENCRYPTION_KEY: facdd3a131ddd8988b14f6e4e01039c93cfa0160
  volumes:
    - .:/usr/src/app
    - bundler:/home/docker/.bundle/
    - canvas-docker-gems:/home/docker/.gem/
    - node_modules:/usr/src/app/node_modules
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *WEB
    ports:
      - "8080:80"

  jobs:
    <<: *WEB
    # Invoke Ruby directly so a Windows CRLF shebang does not break the script.
    command: bundle exec ruby script/delayed_job run

  postgres:
    build: ./docker-compose/postgres
    environment:
      POSTGRES_PASSWORD: sekret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bundler:
  canvas-docker-gems:
  node_modules:
